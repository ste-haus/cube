name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm --prefix web ci

      - name: Typecheck
        run: npm --prefix web run check

      - name: Test
        run: npm --prefix web test

      - name: Build
        run: npm --prefix web run build

  # The version lives in the tags. Merging to main cuts the next one, and the image is built
  # from it in the same run — a tag pushed with GITHUB_TOKEN does not start another.
  release:
    needs: [python, web]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: write

    outputs:
      version: ${{ steps.next.outputs.version }}
      series: ${{ steps.next.outputs.series }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: next
        run: |
          set -euo pipefail

          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)

          if [ -z "$latest" ]; then
            major=0; minor=1; patch=0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"

            # A merge says how far it moves things; anything unmarked is a patch.
            case "$(git log -1 --pretty=%B)" in
              *'#major'*) major=$((major + 1)); minor=0; patch=0 ;;
              *'#minor'*) minor=$((minor + 1)); patch=0 ;;
              *)          patch=$((patch + 1)) ;;
            esac
          fi

          version="${major}.${minor}.${patch}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "series=${major}.${minor}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version} (previous: ${latest:-none})"

      - name: Tag it
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.next.outputs.version }}" -m "v${{ steps.next.outputs.version }}"
          git push origin "v${{ steps.next.outputs.version }}"

  image:
    needs: [python, web, release]
    runs-on: ubuntu-latest

    # A pull request runs the tests and stops there; building an artefact nobody can pull is
    # time spent for no one.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=${{ needs.release.outputs.series }}
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
