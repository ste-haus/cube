[metadata]
name = cube
# Not the released version. Releases are tagged by CI on merge to main, and the image is
# tagged from that; this exists because setuptools requires it.
version = 0.0.0
description = A Home Assistant wall panel that runs outside Home Assistant
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3

[options]
packages = find:
package_dir = =src
python_requires = >=3.12
include_package_data = True
install_requires =
    fastapi>=0.115
    uvicorn[standard]>=0.32
    httpx>=0.28
    websockets>=14.0
    pydantic>=2.10
    pydantic-settings>=2.7
    pyyaml>=6.0

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=8.3
    pytest-asyncio>=0.25
    ruff>=0.9

[options.entry_points]
console_scripts =
    cube = cube.__main__:main

[tool:pytest]
asyncio_mode = auto
testpaths = tests
