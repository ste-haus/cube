services:
  cube:
    build: .
    image: cube:local
    restart: unless-stopped
    ports:
      - "4096:4096"
    env_file:
      - .env
    volumes:
      # The dashboard definition and the floorplan drawings both describe your home, so they
      # are mounted rather than baked into the image.
      - ./config.yaml:/app/config.yaml:ro
      - ./resources:/app/resources:ro
      # Where the radar and its map are kept, so a rebuild does not start them cold.
      - ./cache:/cache
